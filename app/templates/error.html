<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ status_code }} · pickerPro®</title>
  <style>
    :root { color: #1e293b; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
    main { width: 100%; max-width: 440px; padding: 2.25rem; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 30px rgb(15 23 42 / 0.08); }
    .code { margin: 0; color: #c2410c; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.12em; }
    h1 { margin: 0.5rem 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    p { margin: 0; color: #64748b; line-height: 1.55; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.65rem 0.9rem; border-radius: 8px; color: #fff; background: #c2410c; font-size: 0.9rem; font-weight: 700; text-decoration: none; }
    a:hover { background: #9a3412; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR {{ status_code }}</p>
    <h1>{{ title }}</h1>
    <p>OOPS! something went wrong and we couldn't process your request. Try again later or contact support if the problem persists.
    </p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
